backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "puppies"
    label: "Puppies"
    folder: "data"
    file: "puppies.json"
    format: "json"
    editor:
      preview: false
    fields:
      - name: puppies
        label: Puppies
        widget: list
        fields:
          - { name: name, label: Name, widget: string, required: true }
          - { name: price, label: Price, widget: string, required: true, pattern: ['^\$\d+', "Price must start with $ (e.g., $800)"] }
          - { name: age, label: Age, widget: string, required: true, hint: "e.g., 7 weeks" }
          - { name: gender, label: Gender, widget: select, options: ["Male", "Female"], required: true }
          - { name: description, label: Description, widget: text, required: true }
          - { name: image, label: Main Image, widget: image, required: true }
          - name: gallery
            label: Gallery
            widget: list
            field: { label: Image, name: image, widget: image }
            required: false
          - name: tags
            label: Tags
            widget: list
            field: { label: Tag, name: tag, widget: string }
            default: ["Vet Checked", "Family Raised"]
          - { name: available, label: Available, widget: boolean, default: true }
