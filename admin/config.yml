site_url: https://ecockerspanielpuppies.com

backend:
  name: git-gateway
  branch: main
  identity_url: https://ecockerspanielpuppies.com/.netlify/identity

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "puppies"
    label: "Puppies"
    folder: "data/puppies"
    create: true
    slug: "{{fields.name}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "Puppy Name", name: "name", widget: "string", required: true}
      - {label: "Price USD", name: "price", widget: "number", value_type: "int", required: true}
      - {label: "Age", name: "age", widget: "string", hint: "e.g. 8 weeks", required: true}
      - {label: "Gender", name: "gender", widget: "select", options: ["Male", "Female"], required: true}
      - {label: "Color", name: "color", widget: "string"}
      - {label: "Status", name: "status", widget: "select", options: ["Available", "Reserved", "Sold"], default: "Available"}
      - {label: "Description", name: "description", widget: "text", required: true}
      - {label: "Main Photo", name: "photo", widget: "image", required: true}
      - {label: "Featured on Homepage", name: "featured", widget: "boolean", default: true}
      - {label: "Family Raised", name: "family_raised", widget: "boolean", default: true}
      - {label: "Potty Trained", name: "potty_trained", widget: "boolean", default: false}
      - {label: "Crate Trained", name: "crate_trained", widget: "boolean", default: false}
      - {label: "Health Insurance", name: "health_insurance", widget: "boolean", default: true}
      - {label: "Date Added", name: "date", widget: "datetime", default: "{{now}}"}
