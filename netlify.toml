[build]
  command = "echo 'Static site - no build needed'"
  publish = "."

# Redirect all 404s to index.html for SPA compatibility
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Redirect admin to admin/index.html
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "ALLOW-FROM https://identity.netlify.com"
