[build]
  command = "echo 'Static site - no build needed'"
  publish = "."

# Clean URL redirects (so sitemap URLs resolve to the correct HTML files)
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/puppies"
  to = "/puppies.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

# Redirect admin to admin/index.html
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML files - no cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/html; charset=utf-8"

# CSS and JS files - cache for 30 days
[[headers]]
  for = "/(css|js)/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# Image files - cache for 90 days
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=7776000, immutable"

# JSON files - no cache
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/json"

# Sitemap and robots - cache for 7 days
[[headers]]
  for = "/(sitemap.xml|robots.txt)"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "ALLOW-FROM https://identity.netlify.com"
